# WSL2 Tmux Profile - Ctrl+Shift Key Bindings

# WSL2 specific key bindings
# Using Ctrl+Shift combinations (available in WSL2 terminals)

# Switch windows with Ctrl+Shift+number
bind-key -n C-S-1 select-window -t 1
bind-key -n C-S-2 select-window -t 2
bind-key -n C-S-3 select-window -t 3
bind-key -n C-S-4 select-window -t 4
bind-key -n C-S-5 select-window -t 5

# Previous/next window with Ctrl+Shift+arrows
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window

# Create new window with Ctrl+Shift+T
bind-key -n C-S-t new-window

# Close window with Ctrl+Shift+W
bind-key -n C-S-w kill-window

# Navigate panes with Ctrl+Shift+hjkl
bind-key -n C-S-h select-pane -L
bind-key -n C-S-j select-pane -D
bind-key -n C-S-k select-pane -U
bind-key -n C-S-l select-pane -R

# Zoom pane with Ctrl+Shift+M
bind-key -n C-S-m resize-pane -Z

# WSL2 specific settings
set -g pane-border-status off
set -g pane-border-format ""

# Example: Show WSL indicator in status bar
set -g status-right-length 30
set -g status-right "#(echo 'WSL2') | #H | %H:%M"
