# macOS Tmux Profile - Command/Alt Key Bindings

# macOS specific key bindings
# Note: Alacritty sends specific key codes for Command key combos
# These mirror the Command+number, Command+hjkl bindings

# Switch windows with Alt+number (since Command is typically intercepted by OS)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

# Previous/next window
bind-key -n M-p previous-window
bind-key -n M-n next-window

# Create new window
bind-key -n M-c new-window

# Close window
bind-key -n M-w kill-window

# Navigate panes (override with Alt for quick access)
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Zoom pane
bind-key -n M-m resize-pane -Z

# macOS specific settings
set -g pane-border-status off
set -g pane-border-format ""

# Example: List open windows at bottom
set -g status-right-length 30
set -g status-right "#(echo 'macOS') | #H | %H:%M"
