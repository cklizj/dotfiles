# Tmux Main Configuration with OS-specific Loading
# Auto-detects macOS vs WSL2 and sources appropriate config

# Shared tmux settings
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# Set prefix to Ctrl-A
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reduce escape time
set -sg escape-time 0

# Split panes
bind | split-window -h
bind - split-window -v
unbind '"'
unbind '%'

# Navigate panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Zoom pane
bind m resize-pane -Z

# Mouse support
set -g mouse on

# Colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar
set -g status-bg colour235
set -g status-fg colour136
set -g status-left-length 20
set -g status-right "#H | %F %T"

# Window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# OS-specific configuration
if-shell "uname | grep -q Darwin" {
    source-file ~/.config/tmux/os-profiles/mac.conf
} {
    source-file ~/.config/tmux/os-profiles/wsl.conf
}
